name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Run mocked tests (no live Mercury)
        run: npm test
        env:
          # Intentionally unset — tests inject a fake token. Never add a real secret.
          MERCURY_API_TOKEN: ""
